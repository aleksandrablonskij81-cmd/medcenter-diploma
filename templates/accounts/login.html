{% extends "base.html" %}

{% block title %}Вход — {{ settings.company_name }}{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="mb-4">Вход</h2>
                        <form method="post">
                            {% csrf_token %}
                            {% if form.non_field_errors %}
                                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                            {% endif %}
                            <div class="mb-3">
                                <label class="form-label">Имя пользователя</label>
                                {{ form.username }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                {{ form.password }}
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Войти</button>
                        </form>
                        <p class="text-center mt-3 mb-0">Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
